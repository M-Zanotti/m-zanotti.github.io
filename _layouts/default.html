<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Fonts: Inter (headings) + Source Sans 3 (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Icons: Font Awesome + Academicons (for SSRN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- SEO: structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Marco Zanotti",
    "jobTitle": "Assistant Professor of Finance",
    "worksFor": {"@type": "Organization", "name": "Stockholm School of Economics"},
    "url": "{{ site.url }}"
  }
  </script>
</head>
<body>

  <nav class="site-nav">
    <div class="container nav-inner">
      <a class="nav-name" href="{{ '/' | relative_url }}">Marco Zanotti</a>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
        <a href="{{ '/research/' | relative_url }}" {% if page.url == "/research/" %}class="active"{% endif %}>Research</a>
        <a href="{{ '/cv/' | relative_url }}" {% if page.url == "/cv/" %}class="active"{% endif %}>CV</a>
      </div>
    </div>
  </nav>

  <main class="container page-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      &copy; {{ site.time | date: "%Y" }} Marco Zanotti
    </div>
  </footer>

  <!-- Fade-in on scroll -->
  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('is-visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-in-section').forEach(el => observer.observe(el));
  </script>

</body>
</html>
